<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('pmo-theme');
          if (s === 'light' || s === 'dark') document.documentElement.setAttribute('data-theme', s);
          else document.documentElement.setAttribute('data-theme', 'dark');
          var sb = localStorage.getItem('pmo-sidebar-mode');
          if (sb === 'expanded' || sb === 'collapsed' || sb === 'hidden')
            document.documentElement.setAttribute('data-sidebar', sb);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>PMO CTSB – Project & Resource Management</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
